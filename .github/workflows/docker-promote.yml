name: Promote Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Extract version and SHA
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote image
        run: |
          SRC="ghcr.io/${{ github.repository }}:${SHA}"
          DST_VERSION="ghcr.io/${{ github.repository }}:${VERSION}"
          DST_LATEST="ghcr.io/${{ github.repository }}:latest"

          echo "Promoting ${SRC} -> ${DST_VERSION}, ${DST_LATEST}"
          skopeo copy --all docker://$SRC docker://$DST_VERSION
          skopeo copy --all docker://$SRC docker://$DST_LATEST

      - name: Promote UI image
        run: |
          SRC="ghcr.io/${{ github.repository }}-ui:${SHA}"
          DST_VERSION="ghcr.io/${{ github.repository }}-ui:${VERSION}"
          DST_LATEST="ghcr.io/${{ github.repository }}-ui:latest"

          echo "Promoting ${SRC} -> ${DST_VERSION}, ${DST_LATEST}"
          skopeo copy --all docker://$SRC docker://$DST_VERSION
          skopeo copy --all docker://$SRC docker://$DST_LATEST

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
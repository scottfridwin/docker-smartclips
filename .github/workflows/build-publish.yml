name: CI / Build / Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to release (e.g., v1.0.0). Promotes current main images."
        required: false
        type: string
      build_branch:
        description: "Set to 'true' to build and push images from the current branch (tagged :sha-XXXXXXX only)."
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER: scottfridwin

jobs:
  # ----------------------------------------------------------
  # Test: Run Go tests and vet for all modules
  # ----------------------------------------------------------
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: [smartclips, smartclips-ui]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: |
          cd ${{ matrix.module }}
          go test ./...
          go vet ./...

      - name: Verify build
        run: |
          cd ${{ matrix.module }}
          if [ "${{ matrix.module }}" = "smartclips" ]; then
            go build ./cmd/smartclips
          else
            go build ./cmd/server
          fi

  # ----------------------------------------------------------
  # Build: Build and push Docker images
  # Runs on push to main OR manual dispatch with build_branch=true
  # ----------------------------------------------------------
  build:
    name: Build ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_branch == 'true')
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker-smartclips
            file: Dockerfile
          - image: docker-smartclips-ui
            file: Dockerfile.ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}"
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAGS="${IMAGE}:sha-${SHORT_SHA}"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${IMAGE}:main"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Generated tags: ${TAGS}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ----------------------------------------------------------
  # Release: Promote existing main images with version tags
  # Triggered via workflow_dispatch with a version tag input.
  # ----------------------------------------------------------
  release:
    name: Release ${{ matrix.image }} as ${{ github.event.inputs.release_tag }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: [docker-smartclips, docker-smartclips-ui]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install crane
        uses: imjasonh/setup-crane@v0.5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Promote image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}"
          VERSION_TAG="${{ github.event.inputs.release_tag }}"
          VERSION_NO_V="${VERSION_TAG#v}"

          echo "Promoting ${IMAGE}:main → ${VERSION_TAG}, ${VERSION_NO_V}, latest"

          crane copy "${IMAGE}:main" "${IMAGE}:${VERSION_TAG}"
          crane copy "${IMAGE}:main" "${IMAGE}:${VERSION_NO_V}"
          crane copy "${IMAGE}:main" "${IMAGE}:latest"

      - name: Create git tag
        run: |
          VERSION_TAG="${{ github.event.inputs.release_tag }}"
          git tag "$VERSION_TAG" || true
          git push origin "$VERSION_TAG" || true

  # ----------------------------------------------------------
  # Release notes: Create GitHub Release after promotion
  # ----------------------------------------------------------
  release-notes:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          VERSION_TAG="${{ github.event.inputs.release_tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | grep -v "^${VERSION_TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" | head -50)
          else
            NOTES="Initial release"
          fi

          echo "$NOTES" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "## Docker Images" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo '```' >> /tmp/release-notes.md
          echo "docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/docker-smartclips:${VERSION_TAG}" >> /tmp/release-notes.md
          echo "docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/docker-smartclips-ui:${VERSION_TAG}" >> /tmp/release-notes.md
          echo '```' >> /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false

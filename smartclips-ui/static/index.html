<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>SmartClips Manager</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; padding: 1rem; }
h1 { margin-bottom: 1rem; color: #7dd3fc; }
.toolbar { margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
button { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-danger { background: #ef4444; color: #fff; }
.btn-success { background: #22c55e; color: #fff; }
.btn-secondary { background: #475569; color: #fff; }
table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
th, td { padding: 0.5rem; border: 1px solid #334155; text-align: left; }
th { background: #0f172a; position: sticky; top: 0; }
tr:nth-child(even) { background: #1e293b; }
tr.selected { background: #1e3a5f; }
input, select, textarea { background: #0f172a; color: #eee; border: 1px solid #475569; border-radius: 4px; padding: 0.4rem; width: 100%; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: #1e293b; padding: 1.5rem; border-radius: 8px; width: 95%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
.modal h2 { margin-bottom: 1rem; color: #7dd3fc; }
.form-group { margin-bottom: 0.75rem; }
.form-group label { display: block; margin-bottom: 0.25rem; color: #94a3b8; font-size: 0.85rem; }
.form-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
.toast { position: fixed; bottom: 1rem; right: 1rem; padding: 0.75rem 1.25rem; border-radius: 4px; color: #fff; z-index: 200; animation: fadeout 0.5s 2.5s forwards; }
.toast.success { background: #22c55e; }
.toast.error { background: #ef4444; }
@keyframes fadeout { to { opacity: 0; } }
</style>
</head>
<body>
<h1><img src="/logo.svg" alt="SmartClips" style="height:1.5em;vertical-align:middle;margin-right:0.5rem">SmartClips Manager</h1>
<div class="toolbar">
    <button class="btn-primary" onclick="openNewClip()">+ New Clip</button>
    <button class="btn-danger" onclick="deleteSelected()">Delete Selected</button>
    <button class="btn-secondary" onclick="refreshClips()">Refresh</button>
</div>
<table>
    <thead>
        <tr>
            <th><input type="checkbox" id="selectAll" onchange="toggleAll(this.checked)"></th>
            <th>Group</th>
            <th>Output</th>
            <th>Input</th>
            <th>Start</th>
            <th>End</th>
            <th>NFO Type</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="clips-body"></tbody>
</table>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2>New Clip – Select Input File</h2>
        <div class="form-group">
            <label>Browse Media</label>
            <div id="breadcrumb" style="margin-bottom:0.5rem;font-size:0.85rem;color:#94a3b8"></div>
            <div id="file-browser" style="max-height:400px;overflow-y:auto;background:#0f172a;border-radius:4px;padding:0.5rem;border:1px solid #475569">
                <div class="loading">Loading...</div>
            </div>
        </div>
        <div class="form-group"><label>Or enter path manually</label><input id="f-input" placeholder="/media/file.mkv"></div>
        <div class="form-actions">
            <button class="btn-primary" onclick="goToEditor()">Continue →</button>
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
let clips = [];

async function refreshClips() {
    const res = await fetch('/api/clips');
    clips = await res.json();
    render();
}

function render() {
    const tbody = document.getElementById('clips-body');
    tbody.innerHTML = clips.map((c, i) => `
        <tr>
            <td><input type="checkbox" class="row-check" data-idx="${i}"></td>
            <td>${esc(c.group || '')}</td>
            <td>${esc(c.output)}</td>
            <td>${esc(c.input)}</td>
            <td>${c.start}</td>
            <td>${c.end}</td>
            <td>${esc(c.nfo_type || '')}</td>
            <td><button class="btn-secondary" onclick="openEditor(${i})">Edit</button></td>
        </tr>
    `).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function toggleAll(checked) {
    document.querySelectorAll('.row-check').forEach(cb => cb.checked = checked);
}

function deleteSelected() {
    const indices = [...document.querySelectorAll('.row-check:checked')].map(cb => +cb.dataset.idx);
    if (!indices.length) return;
    if (!confirm(`Delete ${indices.length} clip(s)?`)) return;
    clips = clips.filter((_, i) => !indices.includes(i));
    render();
    saveAll(true);
}

function openEditor(idx) {
    window.location = `/editor.html?idx=${idx}`;
}

function openNewClip() {
    document.getElementById('modal').classList.add('active');
    browseTo('');
}

function closeModal() { document.getElementById('modal').classList.remove('active'); }

let currentBrowsePath = '';

async function browseTo(path) {
    currentBrowsePath = path;
    const browser = document.getElementById('file-browser');
    const breadcrumb = document.getElementById('breadcrumb');
    browser.innerHTML = '<div class="loading">Loading...</div>';

    // Build breadcrumb
    const parts = path ? path.split('/') : [];
    let bc = '<a href="#" onclick="browseTo(\'\');return false" style="color:#7dd3fc">/media</a>';
    let accum = '';
    for (const p of parts) {
        accum += (accum ? '/' : '') + p;
        const escapedPath = accum.replace(/'/g, "\\'");
        bc += ` / <a href="#" onclick="browseTo('${escapedPath}');return false" style="color:#7dd3fc">${p}</a>`;
    }
    breadcrumb.innerHTML = bc;

    try {
        const res = await fetch(`/api/browse?path=${encodeURIComponent(path)}`);
        if (!res.ok) { browser.innerHTML = '<div style="color:#ef4444">Error loading directory</div>'; return; }
        const entries = await res.json();
        if (!entries || entries.length === 0) {
            browser.innerHTML = '<div style="color:#94a3b8">Empty directory</div>';
            return;
        }
        browser.innerHTML = entries.map(e => {
            const icon = e.is_dir ? '📁' : '🎬';
            const escapedPath = e.path.replace(/'/g, "\\'");
            if (e.is_dir) {
                return `<div style="padding:0.3rem;cursor:pointer" onclick="browseTo('${escapedPath}')">${icon} ${e.name}</div>`;
            } else {
                return `<div style="padding:0.3rem;cursor:pointer;color:#7dd3fc" onclick="selectFile('${escapedPath}')">${icon} ${e.name}</div>`;
            }
        }).join('');
    } catch (e) {
        browser.innerHTML = '<div style="color:#ef4444">Failed to browse</div>';
    }
}

function selectFile(path) {
    document.getElementById('f-input').value = path;
    toast('Selected: ' + path, 'success');
}

function goToEditor() {
    const input = document.getElementById('f-input').value.trim();
    if (!input) { toast('Enter a file path', 'error'); return; }
    window.location = `/editor.html?input=${encodeURIComponent(input)}`;
}

async function saveAll(silent) {
    const res = await fetch('/api/clips', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(clips) });
    if (res.ok) { if (!silent) toast('Saved successfully!', 'success'); else toast('Deleted and saved.', 'success'); }
    else toast('Save failed: ' + await res.text(), 'error');
}

function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

refreshClips();
</script>
</body>
</html>
